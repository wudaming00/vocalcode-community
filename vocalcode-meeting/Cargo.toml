[package]
name = "vocalcode-meeting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vocalcode-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hound = "3.5.1"
# Pure-Rust WebRTC AEC3.  Pin the reviewed port exactly: meeting capture is a
# release-critical offline path and must not pick up DSP changes implicitly.
sonora = "=0.2.0"
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "mp3",
    "pcm",
    "vorbis",
    "aiff",
    "caf",
    "isomp4",
    "mkv",
    "ogg",
    "wav",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
