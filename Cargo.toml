[workspace]
resolver = "2"
members = ["vocalcode-core", "vocalcode-platform", "vocalcode-meeting", "vocalcode-app"]

[workspace.package]
version = "1.4.0"
edition = "2021"
authors = ["VocalCode"]
license = "AGPL-3.0-only"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# internal
vocalcode-core = { path = "vocalcode-core" }
vocalcode-platform = { path = "vocalcode-platform" }
vocalcode-meeting = { path = "vocalcode-meeting" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The vendored sherpa sys build equates debug assertions in its build
# script with a target compiled against the debug MSVC CRT and explicitly
# links msvcrtd. VocalCode uses its downloaded Release DLLs, while Rust's MSVC
# dev/test targets use the normal dynamic CRT; keep this one dependency's build
# logic on the matching release-CRT branch.
[profile.dev.package.sherpa-onnx-sys]
debug-assertions = false

[profile.test.package.sherpa-onnx-sys]
debug-assertions = false

# Vendored for Windows hook safety: grab no longer calls `Keyboard::get_name`
# (AttachThreadInput/ToUnicodeEx inside WH_KEYBOARD_LL), and Windows callbacks
# live in installing-thread TLS rather than aliased `static mut` storage.
# Nothing here reads `Event::name`; see HANDOFF.md 2026-08-05.
[patch.crates-io]
rdev = { path = "vendor/rdev" }
