name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push to a pull request supersedes its older run. Every other run
# (main pushes, manual dispatches) gets a group of its own, so it is neither
# cancelled nor displaced while pending: the release preflight requires a
# successful push run on the exact commit being released.
concurrency:
  group: community-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Scan checked-out files with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          SCAN_TOOL_DIR="$RUNNER_TEMP/vocalcode-gitleaks"
          mkdir -p "$SCAN_TOOL_DIR"
          curl --fail --location --retry 3 --output "$SCAN_TOOL_DIR/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$SCAN_TOOL_DIR/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$SCAN_TOOL_DIR/gitleaks.tar.gz" -C "$SCAN_TOOL_DIR" gitleaks
          "$SCAN_TOOL_DIR/gitleaks" dir "$GITHUB_WORKSPACE" --redact=100 --no-banner
      - name: Install pinned dependency auditor
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_TOOL_DIR="$RUNNER_TEMP/vocalcode-cargo-audit"
          mkdir -p "$AUDIT_TOOL_DIR"
          curl --fail --location --retry 3 --output "$AUDIT_TOOL_DIR/cargo-audit.tgz" \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
          printf '%s  %s\n' 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428 "$AUDIT_TOOL_DIR/cargo-audit.tgz" | sha256sum --check -
          tar -xzf "$AUDIT_TOOL_DIR/cargo-audit.tgz" -C "$AUDIT_TOOL_DIR" --strip-components=1 cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit
          "$AUDIT_TOOL_DIR/cargo-audit" audit --version
          echo "$AUDIT_TOOL_DIR" >> "$GITHUB_PATH"
      - name: Audit Cargo.lock (warnings remain visible)
        run: cargo audit
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: Verify Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clangPath = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $clangPath 'libclang.dll'))) {
            throw 'GitHub Windows image is missing the required LLVM libclang.dll'
          }
          "LIBCLANG_PATH=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Locate macOS libclang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          CLANG_LIBRARY_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$CLANG_LIBRARY_DIR/libclang.dylib"
          echo "LIBCLANG_PATH=$CLANG_LIBRARY_DIR" >> "$GITHUB_ENV"
      - name: Pinned Rust
        run: rustup show
      # Restores the registry and third-party build outputs; workspace and
      # vendored crates (sherpa-onnx, rdev) are always rebuilt from source.
      # The action already hashes the lockfile and toolchain into its key; the
      # explicit key keeps that visible. Only main saves, so a pull request
      # can read main's cache but never write one that main would restore.
      - name: Cache Cargo registry and dependency builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features vocalcode-app/community -- -D warnings
      - name: Developer diagnostics build (never packaged)
        run: cargo check -p vocalcode-app --all-targets --locked --features diagnostic-cli
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked --features vocalcode-app/community
      - name: Community UI contracts
        run: node --test packaging/community/test-community-ui.mjs
      - name: Synthetic replay metric contracts (no models or audio devices)
        run: node --test packaging/release/test_replay_metrics.mjs
      - name: App UI regressions (every packaging/release/test_*.mjs)
        run: node --test "packaging/release/test_*.mjs"
      - name: Source licence and documentation contracts
        run: node --test packaging/community/test-licensing.mjs
      - name: Public source inventory
        run: node packaging/community/source-manifest.mjs --git-check
      - name: Signed-release and packaging contracts
        run: python -m unittest discover -s packaging/community -p 'test_*.py' -v
      - name: Unsigned community build — no production secrets
        run: cargo build -p vocalcode-app --release --locked --features community
      - name: Validate Windows packaging and actual native linkage without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/community/windows.ps1 -Mode Pack
      - name: Verify pinned Inno publisher and compile unsigned installer without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/community/windows.ps1 -Mode Tools
          & (Join-Path $env:RUNNER_TEMP 'community-inno\ISCC.exe') /Qp packaging/community/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned installer compilation failed' }
      - name: Stage the end-to-end inputs (the unsigned installer and the unit-test binary)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The same flags as "Workspace tests", so nothing is rebuilt.
          $lines = cargo test --workspace --all-targets --locked --features vocalcode-app/community --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'cargo test --no-run failed' }
          $exe = @($lines | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'vocalcode-app' -and $_.profile.test -and $_.target.kind -contains 'bin' } |
            ForEach-Object { $_.executable } | Select-Object -Unique)
          if ($exe.Count -ne 1) { throw "Expected one vocalcode-app unit-test binary, found $($exe.Count)" }
          $stage = Join-Path $env:RUNNER_TEMP 'e2e-inputs'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe[0] -Destination (Join-Path $stage 'vocalcode-app-tests.exe')
          foreach ($dll in @('onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll')) {
            Copy-Item -LiteralPath (Join-Path 'target/debug' $dll) -Destination $stage
          }
          Copy-Item -LiteralPath 'dist-community/artifacts/VocalCodeSetup.exe' -Destination $stage
      - name: Keep the end-to-end inputs for the next job
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-windows-inputs
          path: ${{ runner.temp }}/e2e-inputs/
          retention-days: 1
          if-no-files-found: error
      - name: Validate macOS bundle, architecture and actual native linkage without credentials
        if: runner.os == 'macOS'
        run: python packaging/community/release.py build-macos
      - name: Retain developer build (not a signed installer)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vocalcode-community-dev-${{ matrix.os }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            target/release/vocalcode-app.exe
            target/release/vocalcode-app
            target/release/*.dll
            target/release/*.dylib
            LICENSE
            LICENSING.md
            BUILDING.md
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-LICENSES/
  # A paid VocalCode updates to this build through its own in-app updater, and
  # the early free build is replaced, on a disposable hosted runner with the
  # real signed installers of those releases (sha-pinned). See
  # packaging/community/e2e-windows.ps1.
  e2e-windows:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e2e-windows-inputs
          path: ${{ runner.temp }}/e2e-inputs
      - name: Cache the pinned earlier installers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vocalcode-e2e-downloads
          key: vocalcode-e2e-installers-2ba1b7b36be74ae3819b5eec2e8a217dbbfbac2a44e0232d01f325e91028cb1a-55b49f79ae74c96a5be04fbe6a351bf2068f75b40de36056cbd02b9aacd1c6cd
      - name: A paid VocalCode 1.2.1 updates in place through its own updater
        shell: pwsh
        run: >-
          ./packaging/community/e2e-windows.ps1 -Scenario Paid
          -Installer "$env:RUNNER_TEMP/e2e-inputs/VocalCodeSetup.exe"
          -TestExe "$env:RUNNER_TEMP/e2e-inputs/vocalcode-app-tests.exe"
          -Downloads "$env:RUNNER_TEMP/vocalcode-e2e-downloads"
      - name: VocalCode Community 1.4.0 is replaced and its data stays importable
        shell: pwsh
        run: >-
          ./packaging/community/e2e-windows.ps1 -Scenario Early
          -Installer "$env:RUNNER_TEMP/e2e-inputs/VocalCodeSetup.exe"
          -TestExe "$env:RUNNER_TEMP/e2e-inputs/vocalcode-app-tests.exe"
          -Downloads "$env:RUNNER_TEMP/vocalcode-e2e-downloads"
      - name: Keep the installer logs (paths and steps only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-windows-logs
          path: ${{ runner.temp }}/vocalcode-e2e-*/*.log
          retention-days: 7
          if-no-files-found: ignore
