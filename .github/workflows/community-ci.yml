name: Community checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Scan checked-out files with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          SCAN_TOOL_DIR="$RUNNER_TEMP/vocalcode-gitleaks"
          mkdir -p "$SCAN_TOOL_DIR"
          curl --fail --location --retry 3 --output "$SCAN_TOOL_DIR/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$SCAN_TOOL_DIR/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$SCAN_TOOL_DIR/gitleaks.tar.gz" -C "$SCAN_TOOL_DIR" gitleaks
          "$SCAN_TOOL_DIR/gitleaks" dir "$GITHUB_WORKSPACE" --redact=100 --no-banner
      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock (warnings remain visible)
        run: cargo audit
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: Verify Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clangPath = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $clangPath 'libclang.dll'))) {
            throw 'GitHub Windows image is missing the required LLVM libclang.dll'
          }
          "LIBCLANG_PATH=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Locate macOS libclang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          CLANG_LIBRARY_DIR="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$CLANG_LIBRARY_DIR/libclang.dylib"
          echo "LIBCLANG_PATH=$CLANG_LIBRARY_DIR" >> "$GITHUB_ENV"
      - name: Pinned Rust
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --locked --features vocalcode-app/community
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features vocalcode-app/community -- -D warnings
      - name: Community UI contracts
        run: node --test packaging/community/test-community-ui.mjs
      - name: Meeting, correction, migration, calendar and dictation UI regressions
        run: node --test packaging/release/test_calendar_ui.mjs packaging/release/test_correction_review_ui.mjs packaging/release/test_filler_history_ui.mjs packaging/release/test_meeting_prompt_ui.mjs packaging/release/test_meeting_ui.mjs packaging/release/test_migration_ui.mjs packaging/release/test_noise_filter_ui.mjs packaging/release/test_workflow_ui.mjs
      - name: Source licence and documentation contracts
        run: node --test packaging/community/test-licensing.mjs
      - name: Public source inventory
        run: node packaging/community/source-manifest.mjs
      - name: Signed-release and packaging contracts
        run: python -m unittest discover -s packaging/community -p 'test_*.py' -v
      - name: Unsigned community build — no production secrets
        run: cargo build -p vocalcode-app --release --locked --features community
      - name: Validate Windows packaging and actual native linkage without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/community/windows.ps1 -Mode Pack
      - name: Verify pinned Inno publisher and compile unsigned installer without credentials
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/community/windows.ps1 -Mode Tools
          & (Join-Path $env:RUNNER_TEMP 'community-inno\ISCC.exe') /Qp packaging/community/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned installer compilation failed' }
      - name: Validate macOS bundle, architecture and actual native linkage without credentials
        if: runner.os == 'macOS'
        run: python packaging/community/release.py build-macos
      - name: Retain developer build (not a signed installer)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vocalcode-community-dev-${{ matrix.os }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            target/release/vocalcode-app.exe
            target/release/vocalcode-app
            target/release/*.dll
            target/release/*.dylib
            LICENSE
            LICENSING.md
            BUILDING.md
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-LICENSES/
